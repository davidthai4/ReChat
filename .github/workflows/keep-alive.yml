name: Keep alive

# Wakes the Render backend weekly. On startup it connects to MongoDB Atlas,
# which counts as activity and keeps the free cluster from auto-pausing
# after 30 idle days.
on:
  schedule:
    - cron: '0 16 * * 1' # Mondays, 16:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          # A sleeping Render free instance can take ~1 minute to start.
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 20 --retry-all-errors \
            --max-time 120 \
            https://rechat-server-lokn.onrender.com/health
